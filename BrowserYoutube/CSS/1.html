<!DOCTYPE html>
<html>
    <head>
        <title>CSS inline</title>
    </head>
    <body>
        <!-- inline -->
        <h1 style="color: aqua; 
        font-size: 50px;">Hello CSS</h1>
        <!-- internal -->
        <style>
            p{
                color:brown;
                font-family: Arial;
            }
            h1{
                color: blueviolet;
            }
            b{
                color:chocolate
            }
            i {
                color:olive;
                background-color:yellow;
            }
            div{
                background-color:burlywood
            }
        </style>
        <p>hello <i>C</i><b>S</b>S</p>
        <h1>halllooooo</h1>
    </body>
</html>
