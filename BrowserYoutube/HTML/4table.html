<!DOCTYPE html>
<html>
    <head>
        <title>Table</title>
    </head>
    <body>
        <textarea name="text" id="text" cols="30" rows="10">ffff</textarea>
        <h1 align="center">TABLE</h1>
        <br><br>
        <table border="1" align="center">
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
        </table><br><br>
        <h1 align="center">WITH HEADER</h1>
        <br><br>
        <table border="1">
            <tr>
                <th>MONDAY</th>
                <td>Why this day again?</td>
                <td>must go to school</td>
            </tr>
            <tr>
                <th>NIGHT SUNDAY</th>
                <td>Oh hell yeah!!!!!</td>
                <td>i dont give a sh## with school</td>
            </tr>
        </table>
        <br>
        <br>
        <h3>ANOTHER WITH HEADER</h3> <br><br>
        <table border="1">
            <th>MONDAY</th>
            <th>NIGHT SUNDAY</th>
            <tr>
                <td>Why this day again?</td>
                <td>Oh hell yeah!!!!!</td>
            </tr>
        </table><br><br>
        <table border="1">
            <th>MONDAY</th>
            <th>SUNDAY</th>
            <th rowspan="2">LIFE</th>
            <tr>
                <td colspan="2">don't learn!!</td>
            </tr>
        </table>
        
        <!-- length of table will match the length of char -->
    </body>

</html>
