<!DOCTYPE html>
<html>
    <style>

        .head {
            width:100%;
            background: lightgreen;
            height: 600px
        }

        @keyframes scroll {
            from {
                opacity: 0;
                scale: 0.3
            }
            to {
                opacity: 1;
                scale: 1
            }
        }

        .block {
            background: purple;
            height: 100px;
            width: 100px;
            margin: 10px;
            animation: scroll linear;
            animation-timeline: view();
            animation-range: entry 0 cover 30%;
        }

    </style>

    <div>
        <p class="head">head</p>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
        <div class="block"></div>
    </div>
</html>
