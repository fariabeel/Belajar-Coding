<!DOCTYPE html>
<html>

<style>

/*
main concept:

blur()
brightness()
contrast()
drop-shadow()
grayscale()
hue-rotate()
invert()
opacity()
saturate()
sepia()
*/

img {height: 200px; margin: 3px; display: inline-block}

#blur {filter: blur(1px)}
#brightness {filter: brightness(110%)}
#brightness-darker {filter: brightness(90%)}
#contrast {filter: contrast(150%)}
#contrast-grayer {filter: contrast(70%)}
#drop-shadow {filter: drop-shadow(8px 8px 10px gray)}
#drop-shadow0 {filter: drop-shadow(8px 8px 10px lightcoral)}

#grayscale {filter: grayscale(1)}
#grayscale0 {filter: grayscale(50%)}
#grayscale1 {filter: grayscale(0.3)}
#hue-rotate {filter: hue-rotate(90deg)}
#hue-rotate0 {filter: hue-rotate(-90deg)}
#invert {filter: invert(100%)}
#invert0 {filter: invert(0.6)}
#opacity {filter: opacity(50%)}
#opacity0 {filter: opacity(0.6)}
#saturate {filter: saturate(0%)} /* normal 100% */
#saturate0 {filter: saturate(200%)}
#sepia {filter: sepia(1)}
#sepia0 {filter: sepia(50%)}

</style>
