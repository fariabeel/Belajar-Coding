<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
        <style>
            input{
                font-size: 120%;
                color: darkslategray;
                background-color: rgb(206, 235, 252);
                border: 1px solid rgb(253, 255, 153);
                border-radius: 100px;
                padding: 5px 5px 5px 30px;
                display: block;
                margin-bottom:5px;
                background-repeat:no-repeat;
                background-size: 20px;
                background-position: 8px;
            }
            input:focus{
                background-color: #cbf3fd;
            }
            input#email{
                background-image: url(https://cdn.pixabay.com/photo/2016/06/13/17/30/mail-1454731_640.png);
            }
            input#instagram{
                background-image: url(https://upload.wikimedia.org/wikipedia/commons/thumb/9/95/Instagram_logo_2022.svg/640px-Instagram_logo_2022.svg.png);
            }
            input#web{
                background-image: url(https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcReEN-uhB6OSwMZTUKqo8v2gfyHjAetjI540Q&s);
            }
            input#submit{
                color: #efefef;
                text-shadow: 1px 1px 5px #ffffff;
                background-color: darkslategrey;
                padding: 5px 10px 5px 10px;
            }
            input#submit:hover{
                color: rgb(172, 172, 172);
                background-color: white;
            }
        </style>
    </head>
    <body>
        <h1>Form</h1>
        <form action="">
            <input type="text" name="" id="email">
            <input type="text" name="" id="instagram">
            <input type="text" name="" id="web">
            <input type="submit" name="" id="submit">
        </form>
    </body>
</html>
