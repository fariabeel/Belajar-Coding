<!DOCTYPE html>
<html class="overflow-x-hidden w-[100%]">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<style type="text/tailwindcss">
@import "tailwindcss";

.changed {
    background: black
}

</style>

<button class="bg-red-300 w-30 h-20" id="change">click</button>
<div id="real">demo</div>

<script>
    const elem = document.getElementById("real")
    document.getElementById("change").addEventListener("click", function() {
        if(elem.classList.contains("changed")) {
            elem.classList.remove("changed")
        } else {
            elem.classList.add("changed")
        }
    })
</script>
</html>
