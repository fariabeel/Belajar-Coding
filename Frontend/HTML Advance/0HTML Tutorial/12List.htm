<!DOCTYPE html>
<html>

<!-- List -->

<dl>
  <dt>Coffee</dt>
  <dd>- black hot drink</dd>
  <dt>Milk</dt>
  <dd>- white cold drink</dd>
</dl> <br>

<!-- The <dl> tag defines the description list, the <dt> tag defines the term (name), and the <dd> tag describes each term -->

<!-- Unordered List -->

<ul>
 <li>test
  <ul>
   <li>test</li>
  </ul>
 </li>
</ul>

<style>

#ul {list-style-type: none}

#li {
  float: left; 
  padding:10px; 
  background-color: aquamarine
}

</style>

<ul id=ul>

 <li id=li>Home</li>
 <li id=li>News</li>
 <li id=li>Contact</li>
 <li id=li>About</li>

</ul> <br> <br>

<!-- Ordered List -->

<ol type="i"> <!--type=1/a/A/I/i-->
<li>a</li>
<li>a</li>
</ol>

<ol start="50">
 <li>zero</li>
 <li>zero</li>
 <li>zero</li>
 <li>zero</li>
 <li>zero</li>
</ol>

<ol>
 <li>
  <ol>
   <li>zero</li>
  </ol>
 </li>
</ol>

</html>
