<!DOCTYPE html>
<html>

<em>This text is emphasized</em>
<!--
defines emphasized text. The content inside is typically displayed in italic.
-->

<strong>Important!</strong> 
<!--defines text with strong importance.-->

<small> smaller </small>

<mark>marked</mark>

<del>deleted</del>
<!-- 
The HTML <del> element defines text that has 
been deleted from a document. 
-->

<ins>inserted</ins>
<!-- defines a text that has been inserted into a document -->

</html>
