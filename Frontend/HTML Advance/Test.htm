<!DOCTYPE html>
<html>
  <style>
    div {
      width: 100px;
      height: 100px;
      border: 1px solid;
      padding: 10px
    }

    img {width: 100px}
  </style>
  <div
  ondragover="Dragov(event)"
  ondrop="Drop(event)"
  ></div>
  <img
  draggable
  ondragstart="Drag(event)"
  src="https://cdn-icons-png.freepik.com/512/1/1492.png" alt="" id="demo">
  
  <script>
    function Drag(ev) {
      ev.dataTransfer.setData("id",ev.target.id)
    }
    
    function Dragov(ev) {
      ev.preventDefault()
    }

    function Drop(ev) {
      ev.preventDefault()
      ev.target.appendChild(document.getElementById(ev.dataTransfer.getData('id')))
    }
  </script>
</html>
