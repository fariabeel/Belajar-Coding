<!DOCTYPE html>
<html>

<form action="">
 <input type="text">
 <input type="submit" formaction=""> <!--formaction="form handler file"-->
</form>
<!-- formaction work in submit and image input types -->

<form>
 <input type="submit" formenctype="multipart/form-data">
</form>
<!-- formenctype work in submit and image input types -->

<form>
 <input type="text" name="wow">
 <input type="submit" formmethod="post" value="post">
 <input type="submit" formmethod="get" value="get">
</form>
<!-- formmethod work in submit and image input types -->

<form>
 <input type="submit" formtarget="_blank">
</form>
<!-- formtarget work in submit and image input types -->

<form method="get" novalidate>
 <input type="text" name="wo">
 <input type="submit">
</form>
<!-- hen present, novalidate specifies that all of the form-data should not be validated when submitted. -->
