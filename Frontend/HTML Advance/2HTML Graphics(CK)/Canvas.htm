<!DOCTYPE html>
<html>

<canvas id="myCanvas" width="200" height="100" style="border:0.1px solid black;"></canvas>
<script>
var c= document.getElementById("myCanvas");
var ctx= c.getContext("2d");
ctx.moveTo(0, 0);
ctx.lineTo(200, 100);
ctx.stroke();
</script>

<canvas height="100" width="200" style="border: 1px solid black" id="Canvas"></canvas>
<script>
var c=document.getElementById("Canvas");
var ctx=c.getContext("2d");
ctx.beginPath();
ctx.arc(95, 50, 40, 0, 2 * Math.PI);
ctx.stroke();
</script>

<canvas height="100" width="200" style="border: 1px solid #d3d3d3;" id="1canvas"></canvas>
<script>

<canvas height="100" width="200" id="2canvas" style="border:1px solid #d3d3d3;"></canvas>
<script>
var c = document.getElementById("2canvas");
var ctx = c.getContext("2d");

var grd = ctx.createLinearGradient(0,0,200,0);
grd.addColorStop(0,"red");
grd.addColorStop(1,"white");

ctx.fillStyle=grd;
ctx.fillRect(10,10,150,80);
</script>

<canvas height="100" width="200" style="border: 1px solid #d3d3d3;" id="3canvas"></canvas>
<script>

var ctx = c.getContext("2d");

grd.addColorStop(0,"red")
grd.addColorStop(1,"white");

ctx.fillStyle=grd;
ctx.fillRect(10,10,150,80);
</script>
