<!DOCTYPE html>
<html>

<style>

#size{font-size: 30px}
#size1{font-size: 1.875em} /* 1em=16px */
#size2{font-size: 183%}
#size3{font-size: 5vw}
/* 
To allow users to resize the text (in the browser menu), many developers use em instead of pixels.
*/

/* 
1vw = 1% of viewport width. If the viewport is 50cm wide, 1vw is 0.5cm. 
*/

</style>

<p id="size">size</p>
<p id="size1">size</p>
<p id="size2">size</p>
<p id="size3">size</p>

</html>
