<!DOCTYPE html>
<html>

<style>

table, th, td {
    border: 1px solid; 
    border-collapse: collapse;
}

table{
    width: 200px;
    height: 200px;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%)
}

#th{text-align: left; vertical-align: bottom;}
#right-td{text-align: right}
td{vertical-align: top}

</style>

<table>
    <tr>
        <th id="th">th</th>
        <th id="th">th</th>
        <th id="th">th</th>
    </tr>
    <tr>
        <td id="right-td">td</td>
        <td>td</td>
        <td>td</td>
    </tr>
    <tr>
        <td>td</td>
        <td>td</td>
        <td>td</td>
    </tr>
</table>

</html>
