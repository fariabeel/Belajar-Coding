<!DOCTYPE html>
<html>

<style>
/* 
selector::pseudo-element { property: value;} 
A CSS pseudo-element is used to style specific parts of an element.
*/

.firstline::first-line {color: blue}
/* 
can only be applied to block-level elements.
properties apply to the ::first-line pseudo-element:

font properties
color properties
background properties
word-spacing
letter-spacing
text-decoration
vertical-align
text-transform
line-height
clear 

The single-colon syntax was used for both pseudo-classes and pseudo-elements in CSS2 and CSS1.
*/

.firstletter::first-letter {font-size: xx-large}
/* 
::first-letter pseudo-element can only be applied to block-level elements.
The following properties apply to the ::first-letter pseudo- element: 

font properties
color properties 
background properties
margin properties
padding properties
border properties
text-decoration
vertical-align (only if "float" is "none")
text-transform
line-height
float
clear 
*/
p#firstletter0::first-letter {font-size: xx-large}

.before::before {content: url("sqpurple.gif") " "}
.after::after {content: " " url("sqpurple.gif")}

::selection {color: red; background-color: yellow}
/* select some text to know selection */

.opacity{opacity: 0.5}
.opacity-hover:hover{opacity:1}
.opacity-hover0:hover{opacity: 0.5}

#transparent-box {
    border: 1px solid; 
    background-color: yellow; 
    opacity: 0.5
}

</style>

<p class="firstline">first line <br> second line</p>
<p class="firstletter">First letter</p>
