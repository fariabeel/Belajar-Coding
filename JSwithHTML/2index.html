<html>
    <head>
        <style>
            #container {
                width: 250px;
                height: 90px;
                position: relative;
                background: rgb(215, 245, 250);
                padding-left: 100px;
            }
            #animate {
                text-align: center;
                width: 150px;
                height: 50px;
                position: absolute;
                background: rgb(184, 206, 228);
                color: rgb(113, 122, 129);
            }
        </style>
    </head>

    <body>
        <h2>JavaScript Validation</h2>


        <form action="" method="post">
            <input type="text" name="fname" required>     
            <input type="submit" value="real wak"> 
        </form>


        <p id="1">Hello World!</p>


        <button 
        type="button"
        onclick="document.getElementById('2').style.color= 'red'"
        >Change it</button> <br>
        <button 
        type="button"
        onclick="document.getElementById('2').style.color= 'yellow'"
        >Change it</button> 
        <h1 id="2"> color </h1>


        <button 
        style=
        "height: 50px;
        margin-left: 140px" onclick="moveIt()">Animation</button>
        <div id="container">
            <h1 id="animate">Animation</h1>
        </div>


        <h1 onclick="this.innerHTML = 'real wak'">Event</h1>
        


        <script>
            document.getElementById("1").style.color="blue";


            function moveIt() {
                let id = null;
                const elem = document.getElementById("animate");
                let pos = 0;
                clearInterval(id);
                id= setInterval (frame, 5);

                function frame() {
                    if (pos == 350) {
                        clearInterval(id);
                    }
                    else {
                        pos++;
                        elem.style.top = pos + 'px';
                        elem.style.left = pos + 'px';
                    }
                }
            };
            // learn animation againnn!!
            // https://www.w3schools.com/js/js_htmldom_animate.asp

        </script>
    </body>
</html>
