<!DOCTYPE html>
<html>
    <head>
        <title>test form</title>
    </head>
    <body>
        <form
        action="index.html"
        oninput="x.value=parseInt(a.value)+parseInt(b.value)"
        >
        <p>
            button, jika button di click maka muncul alert bertuliskan hello World!
        </p>
        <button type="button" onclick="alert('hello world!')">click me!</button><br />
        <p>data list, masukan buah yang kamu suka!</p>
        <input list="buah" name="buah sehat" />

        <datalist id="buah">
            <option value="narisis"></option>
            <option value="semongko"></option>
            <option value="pisang"></option>
        </datalist>

        <br /><br /><br /><br />

        <p>Output:</p>
        <input type="range" id="a" value="50" /> +
        <input type="number" id="b" value="50" />
        = <output name="x"></output>
        <input type="submit" />
    </form>
    </body>
</html>
